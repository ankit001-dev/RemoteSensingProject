<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
                        background: linear-gradient(135deg, #e9ecf4, #eef2fa, #ebe9f);
/*                        background: linear-gradient( 135deg, #f6e3e6, #eef2fa, #eae6f7 );*/
/*            background: linear-gradient( 135deg, #e8f0f4, #eef2fa, #e9f5f2 );*/
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
/*            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.08);*/
        }

        .logo-text {
            color: #1e88e5;
            font-style: italic;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .login-input {
            padding: 12px 16px;
            border-radius: 12px;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #2196f3, #42a5f5);
            color: #fff;
            border-radius: 30px;
            padding: 10px 28px;
            border: none;
        }

        .btn-outline-primary-custom {
            border: 2px solid #2196f3;
            color: #2196f3;
            border-radius: 30px;
            padding: 10px 28px;
            background: transparent;
        }

            .btn-outline-primary-custom:hover {
                background: #2196f3;
                color: #fff;
            }

        .login-img {
            max-height: 400px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
        }

        /* Gradient bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.9;
        }

        .b1 {
            width: 160px;
            height: 160px;
            background: rgba(156, 39, 176, 0.4);
            top: -40px;
            right: 10%;
        }

        .b2 {
            width: 120px;
            height: 120px;
            background: rgba(33, 150, 243, 0.4);
            top: 15%;
            right: 5%;
        }

        .b3 {
            width: 100px;
            height: 100px;
            background: rgba(33, 150, 243, 0.5);
            bottom: 10%;
            left: 5%;
        }

        .b4 {
            width: 180px;
            height: 180px;
            background: rgba(233, 30, 99, 0.3);
            bottom: 5%;
            right: 30%;
        }

        .logo-box {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(12px);
            border-radius: 10px;
            padding: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }

        .logo-h6 {
            height: 4rem; /* h6 ke barabar */
            width: auto; /* aspect ratio safe */
            object-fit: contain;
        }
       


    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Gradient bubbles -->
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="bubble b4"></span>

        <div class="container">
            <div class="glass-card row g-0 align-items-center">

                <!-- Left Form -->
                <div class="col-md-6 p-4 p-md-5">
                    <h2 class="logo-text d-flex align-items-center">
                        <img src="/assets/images/RemoteLogo.png"
                             class="logo-h6"
                             alt="RSAC Logo">
                    </h2>


                    <h3 class="fw-bold">Project Management System</h3>
                    <h3 class="text-primary small mb-4">Remote Sensing Application Center , Uttar Pradesh</h3>

                    <form>
                        <div class="mb-3">
                            <label class="form-label small">User Name</label>
                            <input type="email" class="form-control login-input" placeholder="example@gmail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small">Password</label>
                            <input type="password" class="form-control login-input" placeholder="••••••">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox">
                                <label class="form-check-label small">Remember me</label>
                            </div>
                            <a href="/Login/ForgotPassword" class="text-primary small fw-semibold">Forgot Password?</a>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary-custom">Sign In</button>
                        </div>
                    </form>

                    <p class="text-muted small mt-4 ">
                        Created by
                        <a href="https://macreel.co.in/homepage" class="text-decoration-none text-blue-500 font-bold hover:underline transition-all">Macreel Infosoft Pvt. Ltd.</a>
                    </p>
                </div>

                <!-- Right Illustration -->
                <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center p-4">

                    <img src="/loginAssets/images/userlogindesignpage.png"  class="login-illustration"/>
                </div>


            </div>
        </div>
    </div>

</body>
</html>
