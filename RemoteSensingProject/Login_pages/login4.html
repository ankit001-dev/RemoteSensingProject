
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProManager | Professional Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /*body {
                font-family: 'Inter', sans-serif;
                background-color: #f1f5f9;
                overflow: hidden;*/ /* Screen hilne se rokne ke liye */
        /*height: 100vh;
            }*/
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive height fix: Screen size ke hisab se card adjust hoga bina scroll ke */
        .login-card-height {
            height: calc(100vh - 4rem); /* Padding minus karke set kiya */
            max-height: 750px;
            min-height: 550px;
        }
    </style>
</head>
<body class="bg-slate-200 flex items-center justify-center">

    <div class="h-screen w-full flex items-center justify-center p-4 md:p-8 overflow-hidden">

        <div class="w-full max-w-6xl login-card-height flex bg-white rounded-[2rem] shadow-2xl overflow-hidden border">

            <div class="hidden lg:flex lg:w-3/5 bg-[#0F172A] relative overflow-hidden items-center justify-center p-10">
                <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

                <div class="relative z-10 w-full max-w-lg">
                    <div class="mb-6 flex items-center gap-4">
                        <div class="glass-effect rounded-2xl p-2 shadow-2xl border border-white/20">
                            <img src="/assets/images/remote_sensing_logo.jfif"
                                 class="w-14 h-14 object-contain rounded-lg"
                                 alt="RSAC Logo" />
                        </div>
                        <div>
                            <h1 class="text-xl font-extrabold text-white leading-tight">Project Management System</h1>
                            <p class="text-slate-400 text-sm font-bold">Remote Sensing Application Center (RSAC) , Uttar Pradesh</p>
                        </div>
                    </div>

                    <div class="glass-effect rounded-3xl p-3 shadow-2xl">
                        <img src="/loginAssets/images/semotesensing-2.png" class="w-full h-auto rounded-2xl shadow-inner" alt="Illustration" />
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-2/5 flex flex-col bg-white overflow-hidden">
                <div class="flex-1 flex flex-col justify-center px-8 md:px-6 py-6">

                    <div class="lg:hidden mb-4 flex justify-center">
                        <img src="/assets/images/remote_sensing_logo.jfif" class="w-14 h-14 object-contain" alt="RSAC Logo">
                    </div>

                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome back</h2>
                        <p class="text-slate-500 mt-1 font-medium text-xs">Access your workspace portal.</p>
                    </div>

                    <form class="space-y-4">
                        <div>
                            <label class="block text-[12px] font-bold text-slate-700 mb-1">User Name</label>
                            <input type="email" placeholder="name@company.com"
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-slate-50 text-sm shadow-sm">
                        </div>

                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="block text-[12px] font-bold text-slate-700 ">Password</label>
                                <a href="/Login/ForgotPassword" class="text-[12px] font-semibold text-blue-600 hover:text-blue-700">Forgot Password ?</a>
                            </div>
                            <input type="password" placeholder="••••••••"
                                   class="w-full px-4 py-2.5 rounded-xl border border-" slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-slate-50 text-sm shadow-sm">
                        </div>

                        <div class="flex items-center">
                            <input type="checkbox" id="remember" class="w-3.5 h-3.5 text-blue-600 border-slate-300 rounded cursor-pointer">
                            <label for="remember" class="ml-2 text-xs text-slate-600 cursor-pointer">Remember me</label>
                        </div>

                        <button type="submit"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1 active:scale-[0.98] text-sm">
                            Sign In
                        </button>
                    </form>

                    <div class="mt-8 pt-4 border-t border-slate-100">
                        <p class="text-center text-slate-400 text-[15px]">
                            Created by <br>
                            <a href="https://macreel.co.in/homepage" class="text-blue-500 font-bold hover:underline transition-all">Macreel Infosoft Pvt. Ltd.</a>
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
