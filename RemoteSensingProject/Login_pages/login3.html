
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #d0e9e6;
            color: #2c2c2c;
        }

        .login-card {
            width: 95%;
            /* Width kam kar di gayi hai */
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .form-side {
            flex: 1 1 55%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-side {
            flex: 1 1 45%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(255,255,255,0.2);
        }

            .hero-side img {
                max-width: 90%;
                height: auto;
            }

        /* Input Icon Fix */
        .input-group-container {
            position: relative;
        }

        .form-control {
            border-radius: 6px;
            padding: 0.6rem 1rem 0.6rem 2.5rem; /* Left padding icons ke liye */
            border: 1px solid #bfc2c7;
            background-color: white;
        }

        .input-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #5c5c5c;
            z-index: 10;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        .remoteLogo {
            height: 3.5rem;
            width: auto;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #5c5c5c;
            border: none;
            padding: 0.6rem;
            font-weight: 600;
        }

            .btn-primary:hover {
                background-color: #474747;
            }

        @@media (max-width: 768px) {
            .hero-side {
                display: none;
            }

            .login-card {
                max-width: 450px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="form-side">

            <div class="mb-4 text-center">
                <!-- Logo + PMS row -->
                <div class="d-flex align-items-center justify-content-center mb-2">
                    <img src="/assets/images/RemoteLogo.png" class="remoteLogo me-2" alt="RSAC Logo" />
                    <h2 class="fw-bold mb-0">PMS</h2>
                </div>

                <!-- RSAC line below -->
                <p class="text-secondary small fw-semibold mb-0">
                    Remote Sensing Application Center , Uttar Pradesh
                </p>
            </div>


            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Email</label>
                    <div class="input-group-container">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" class="form-control" id="email" placeholder="you@company.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase">Password</label>

                    <div class="position-relative">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control" id="password" placeholder="••••••••">
                        <button type="button" class="password-toggle" onclick="togglePassword()"
                                style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none;">
                            <i class="bi bi-eye" id="toggle-icon"></i>
                        </button>
                    </div>

                    <!-- Flex container for forgot password on right -->
                    <div class="d-flex justify-content-end mt-1">
                        <a href="/Login/ForgotPassword" class="text-secondary fw-bold text-primary" style="font-size:0.7rem;">
                            Forgot Password?
                        </a>
                    </div>

                </div>


                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label small" for="terms">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100" disabled id="login-btn">Sign In</button>
            </form>

            <p class="text-muted small mt-4 ">
                Created by
                <a href="https://macreel.co.in/homepage" class="text-decoration-none text-blue-500 font-bold hover:underline transition-all">Macreel Infosoft Pvt. Ltd.</a>
            </p>
        </div>

        <div class="hero-side">
            <img src="/loginAssets/images/loginpage.png" alt="Illustration">
        </div>

    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggle-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        const terms = document.getElementById('terms');
        const loginBtn = document.getElementById('login-btn');
        terms.addEventListener('change', () => {
            loginBtn.disabled = !terms.checked;
        });
    </script>

</body>
</html>
